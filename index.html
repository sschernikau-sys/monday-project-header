<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHBK Projekt-Status-Cockpit</title>
  <!-- Offizielles monday SDK (läuft rein clientseitig) -->
  <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0073ea;
      --primary-hover: #0060c0;
      --bg-color: #f6f7fb;
      --card-bg: #ffffff;
      --text-main: #323338;
      --text-muted: #676879;
      --border-color: #d0d4e4;
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);

      /* Status-Farben */
      --status-ready: #00ca72;
      --status-progress: #579bfc;
      --status-review: #a25ddc;
      --status-warning: #fdab3d;
      --status-stuck: #e2445c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 14px; display: flex; justify-content: center; }

    .header-container {
      width: 100%; max-width: 1200px; background: var(--card-bg);
      border-radius: var(--radius); box-shadow: var(--shadow);
      border: 1px solid var(--border-color); overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; background: linear-gradient(135deg, #1c2738 0%, #2b394e 100%); color: #fff;
    }
    .project-title-area { display: flex; align-items: center; gap: 10px; }
    .project-icon { font-size: 22px; background: rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 6px; }
    .project-title { font-size: 18px; font-weight: 700; }
    .project-subtitle { font-size: 12px; color: #b2b8c2; }

    /* Status Pill */
    .status-badge-container { display: flex; align-items: center; gap: 8px; }
    .status-select {
      appearance: none; padding: 7px 34px 7px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 600; color: #fff; border: none; cursor: pointer;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 10px center; background-size: 16px;
    }
    .status-ready { background-color: var(--status-ready); }
    .status-progress { background-color: var(--status-progress); }
    .status-review { background-color: var(--status-review); }
    .status-warning { background-color: var(--status-warning); }
    .status-stuck { background-color: var(--status-stuck); }

    /* Grid */
    .grid-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; padding: 18px; }
    .card-field { background: #fafbfc; border: 1px solid #e6e9ef; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
    .card-field:focus-within { border-color: var(--primary); background: #fff; }
    .field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .field-input, .field-textarea, .field-select { width: 100%; border: none; background: transparent; font-size: 13px; font-weight: 500; color: var(--text-main); outline: none; }
    .field-textarea { resize: vertical; min-height: 40px; }

    /* Footer */
    .footer-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; background: #fafbfc; border-top: 1px solid var(--border-color); }
    .last-saved { font-size: 12px; color: var(--text-muted); }
    .btn-save { background-color: var(--primary); color: white; border: none; padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-save:hover { background-color: var(--primary-hover); }

    .toast { position: fixed; bottom: 15px; right: 15px; background: #00ca72; color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; display: none; }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="top-bar">
      <div class="project-title-area">
        <div class="project-icon">🏗️</div>
        <div>
          <div class="project-title">Projekt-Steuerung & Status</div>
          <div class="project-subtitle">MHBK Bau- & Vorhabensteuerung</div>
        </div>
      </div>
      <div class="status-badge-container">
        <span style="font-size: 11px; color: #b2b8c2; text-transform: uppercase;">Gesamtstatus:</span>
        <select id="projectStatus" class="status-select status-ready" onchange="this.className='status-select '+this.value">
          <option value="status-ready">🟢 Im Zeitplan</option>
          <option value="status-progress">🔵 In Bearbeitung / Planung</option>
          <option value="status-review">🟣 Behörde / Freigabe</option>
          <option value="status-warning">🟡 Klärungsbedarf</option>
          <option value="status-stuck">🔴 Kritisch / Verzug</option>
        </select>
      </div>
    </div>

    <div class="grid-content">
      <!-- 1. Vorgangsnummer / Aktenzeichen -->
      <div class="card-field">
        <div class="field-label">📁 Vorgangs- / Projekt-ID</div>
        <input type="text" id="projectId" class="field-input" placeholder="z. B. BV-2026-089" />
      </div>

      <!-- 2. Bauart -->
      <div class="card-field">
        <div class="field-label">🧱 Bauart & Standard</div>
        <input type="text" id="constructionType" class="field-input" placeholder="z. B. Massivhaus KfW 40 QNG" />
      </div>

      <!-- 3. Konzept -->
      <div class="card-field">
        <div class="field-label">📐 Gebäudekonzept</div>
        <input type="text" id="projectConcept" class="field-input" placeholder="z. B. EFH 145 m², Satteldach, WP+PV" />
      </div>

      <!-- 4. Aktuelle Phase -->
      <div class="card-field">
        <div class="field-label">🚩 Aktuelle Phase / Meilenstein</div>
        <input type="text" id="currentMilestone" class="field-input" placeholder="z. B. Bauantrag eingereicht" />
      </div>

      <!-- 5. Notiz zum Projektstand (Über ganze Breite wenn Platz) -->
      <div class="card-field" style="grid-column: 1 / -1;">
        <div class="field-label">📝 Aktuelle Notiz / Nächster Schritt</div>
        <textarea id="projectNotes" class="field-textarea" placeholder="z. B. Abstimmung Statik läuft; Rückmeldung bis KW 48 erwartet"></textarea>
      </div>
    </div>

    <div class="footer-bar">
      <div class="last-saved" id="lastSavedText">Noch nicht gespeichert</div>
      <button class="btn-save" onclick="saveData()">💾 Speichern</button>
    </div>
  </div>
  <div id="toast" class="toast">✓ Projektstatus aktualisiert!</div>

  <script>
    const monday = window.mondaySdk();
    let currentBoardId = null;

    document.addEventListener('DOMContentLoaded', () => {
      monday.listen("context", (res) => {
        if (res?.data?.boardId) {
          currentBoardId = res.data.boardId;
          loadData(currentBoardId);
        }
      });
    });

    async function loadData(boardId) {
      const key = `mhbk_status_hdr_${boardId}`;
      try {
        const res = await monday.storage.instance.getItem(key);
        const data = res?.data?.value ? JSON.parse(res.data.value) : JSON.parse(localStorage.getItem(key) || 'null');
        if (data) {
          document.getElementById('projectId').value = data.projectId || '';
          document.getElementById('constructionType').value = data.constructionType || '';
          document.getElementById('projectConcept').value = data.projectConcept || '';
          document.getElementById('currentMilestone').value = data.currentMilestone || '';
          document.getElementById('projectNotes').value = data.projectNotes || '';
          if (data.status) {
            document.getElementById('projectStatus').value = data.status;
            document.getElementById('projectStatus').className = 'status-select ' + data.status;
          }
          if (data.lastSaved) document.getElementById('lastSavedText').innerText = `Aktualisiert: ${data.lastSaved}`;
        }
      } catch (e) { console.error(e); }
    }

    async function saveData() {
      const boardId = currentBoardId || "default";
      const key = `mhbk_status_hdr_${boardId}`;
      const now = new Date();
      const timeStr = now.toLocaleDateString('de-DE') + ' ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      const payload = {
        projectId: document.getElementById('projectId').value,
        constructionType: document.getElementById('constructionType').value,
        projectConcept: document.getElementById('projectConcept').value,
        currentMilestone: document.getElementById('currentMilestone').value,
        projectNotes: document.getElementById('projectNotes').value,
        status: document.getElementById('projectStatus').value,
        lastSaved: timeStr
      };
      try {
        await monday.storage.instance.setItem(key, JSON.stringify(payload));
        localStorage.setItem(key, JSON.stringify(payload));
      } catch (e) { localStorage.setItem(key, JSON.stringify(payload)); }
      document.getElementById('lastSavedText').innerText = `Aktualisiert: ${timeStr}`;
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2500);
    }
  </script>
</body>
</html>
